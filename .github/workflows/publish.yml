name: Package and publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'Src/Witsml/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.repository_owner == 'equinor'
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/equinor/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Build
        run: dotnet build Src/Witsml/Witsml.csproj /warnaserror --configuration Release
      - name: Test
        run: dotnet test ./Tests/Witsml.Tests/Witsml.Tests.csproj --configuration Release
      - name: Package
        run: dotnet pack --configuration Release Src/Witsml -p:Version=2.9.${GITHUB_RUN_NUMBER}
      - name: NuGet login and publish
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set +x
          set -euo pipefail

          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::The NUGET_USER repository secret is not configured."
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::GitHub OIDC is unavailable; the job needs id-token: write."
            exit 1
          fi
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" == *$'\r'* || "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" == *$'\n'* ]]; then
            echo "::error::GitHub supplied an invalid OIDC request token."
            exit 1
          fi

          mask_secret() {
            local value="${1//%/%25}"
            value="${value//$'\r'/%0D}"
            value="${value//$'\n'/%0A}"
            printf '::add-mask::%s\n' "$value"
          }

          curl_config_escape() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '%s' "$value"
          }

          mask_secret "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

          # Keep authorization headers and request bodies off process command lines.
          if ! oidc_token="$(
            printf 'Authorization: Bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
              curl -q --proto '=https' --fail --silent --show-error --header @- \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.nuget.org" |
              jq -er '.value | strings | select(length > 0 and (contains("\n") | not) and (contains("\r") | not))'
          )" || [[ -z "$oidc_token" || "$oidc_token" == *$'\n'* ]]; then
            echo "::error::Failed to obtain an OIDC token from GitHub."
            exit 1
          fi
          mask_secret "$oidc_token"

          request_body="$(jq -nc '{username: env.NUGET_USER, tokenType: "ApiKey"}')"
          if ! api_key="$(
            printf 'header = "Authorization: Bearer %s"\ndata-binary = "%s"\n' \
              "$(curl_config_escape "$oidc_token")" "$(curl_config_escape "$request_body")" |
              curl -q --proto '=https' --fail --silent --show-error \
                --config - --header 'Content-Type: application/json' \
                'https://www.nuget.org/api/v2/token' |
              jq -er '.apiKey | strings | select(length > 0 and (contains("\n") | not) and (contains("\r") | not))'
          )" || [[ -z "$api_key" || "$api_key" == *$'\n'* ]]; then
            echo "::error::NuGet token exchange failed. Check NUGET_USER and the trusted publishing policy."
            exit 1
          fi
          mask_secret "$api_key"

          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL NUGET_USER oidc_token request_body
          dotnet nuget push --api-key "$api_key" --source https://api.nuget.org/v3/index.json \
            "Src/Witsml/bin/Release/WitsmlClient.2.9.${GITHUB_RUN_NUMBER}.nupkg"
