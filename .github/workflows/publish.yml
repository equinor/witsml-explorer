name: Package and publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'Src/Witsml/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.repository_owner == 'equinor'
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/equinor/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Build
        run: dotnet build Src/Witsml/Witsml.csproj /warnaserror --configuration Release
      - name: Test
        run: dotnet test ./Tests/Witsml.Tests/Witsml.Tests.csproj --configuration Release
      - name: Package
        run: dotnet pack --configuration Release Src/Witsml -p:Version=2.9.${GITHUB_RUN_NUMBER}
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json Src/Witsml/bin/Release/WitsmlClient.2.9.${GITHUB_RUN_NUMBER}.nupkg
